spring:
  mail:
    host: smtp.qq.com
    port: 465
    username: 2322672114@qq.com
    password: "${MAIL_PASSWORD}"
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
  data:
    redis:
      host: 121.199.38.195
      port: 6379
      password: "${REDIS_PASSWORD}"
      database: 0
      timeout: 5000ms
  rabbitmq:
    host: 121.199.38.195
    port: 5672
    username: guest
    password: "${MQ_PASSWORD}"
    virtual-host: /
  datasource:
    url: jdbc:mysql://localhost:3306/easylive?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.jdbc.Driver
    password: "${DB_PASSWORD}"
    username: root
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
easylive:
  upload-path: /www/easylive/upload
jwt:
  secret: "${JWT_SECRET}"