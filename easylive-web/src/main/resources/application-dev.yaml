spring:
  datasource:
    url: jdbc:mysql://localhost:3306/easylive?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.jdbc.Driver
    password: 200567
    username: root
  servlet:
    multipart:
      # 默认单文件只能 1MB，视频必挂，这里放大
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      host: 121.199.38.195
      port: 6379
      password: 200567
      database: 0
      timeout: 5000ms
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
server:
  servlet:
    context-path: /api
  port: 8081

# 上传文件根目录。
# 本机开发用 Windows 路径；部署到 Linux 服务器时用启动参数覆盖，例如：
#   java -jar easylive-web.jar --easylive.upload-path=/www/easylive/upload
# （或环境变量 EASYLIVE_UPLOAD_PATH=/www/easylive/upload）
easylive:
  upload-path: D:/MyProjects/Spring/workspace-bilibili/upload
